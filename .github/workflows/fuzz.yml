# Short Atheris fuzzing run of the Python extractor on every PR/push, longer weekly run.
name: Fuzz

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "41 3 * * 1"              # weekly, Monday 03:41 UTC

permissions:
  contents: read

jobs:
  atheris:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          pip install --require-hashes -r .github/requirements/fuzz.txt
          pip install --no-deps -e .
      - name: Fuzz
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'schedule' && '1800' || '60' }}
        run: python fuzz/fuzz_python_extractor.py -max_total_time="$SECONDS_TO_RUN"
