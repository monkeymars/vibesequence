# Publish the landing page (site/) to GitHub Pages: https://monkeymars.github.io/vibesequence/
name: Deploy landing page

on:
  push:
    branches: ["main"]
    paths: ["site/**", "vibesequence/**", ".github/workflows/pages.yml"]   # demo/ is built from the code
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # live demo: the viewer for this repo, built from this commit, source links to GitHub
      - run: |
          pip install ".[ts,go]"
          vibesequence build . --out site/demo --source-url "https://github.com/${{ github.repository }}/blob/${{ github.sha }}"
          rm -f site/demo/cache.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
