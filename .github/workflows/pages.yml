# Publish the landing page (site/) to GitHub Pages: https://monkeymars.github.io/vibesequence/
name: Deploy landing page

on:
  push:
    branches: ["main"]
    paths: ["site/**", "vibesequence/**", ".github/workflows/pages.yml"]   # demo/ is built from the code
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      # live demo: the viewer for this repo, built from this commit, source links to GitHub
      - run: |
          pip install --require-hashes -r .github/requirements/ci.txt
          pip install --no-deps -e .
          vibesequence build . --out site/demo --source-url "https://github.com/${{ github.repository }}/blob/${{ github.sha }}"
          rm -f site/demo/cache.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
