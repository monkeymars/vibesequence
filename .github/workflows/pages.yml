# Publish the landing page (site/) to GitHub Pages: https://monkeymars.github.io/vibesequence/
name: Deploy landing page

on:
  push:
    branches: ["main"]
    paths: ["site/**", "vibesequence/**", ".github/workflows/pages.yml"]   # demo/ is built from the code
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      # live demo: the viewer for this repo, built from this commit, source links to GitHub
      - run: |
          pip install ".[ts,go]"
          vibesequence build . --out site/demo --source-url "https://github.com/${{ github.repository }}/blob/${{ github.sha }}"
          rm -f site/demo/cache.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
