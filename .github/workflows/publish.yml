# Publish to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (no API token stored): configure it once on pypi.org with
# owner "monkeymars", repository "vibesequence", workflow "publish.yml", environment left empty.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write                 # lets PyPI verify this workflow instead of a token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - run: pip install --require-hashes -r .github/requirements/build.txt && python -m build --no-isolation
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
