# On every published release: build the sdist + wheel, scan them with ClamAV (fails on malware),
# attest build provenance, attach them to the release, and send them to VirusTotal
# (scan links are appended to the release notes).
# Verify a downloaded file with: gh attestation verify <file> --repo monkeymars/vibesequence
name: Release security

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  scan-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: write                 # upload assets, update release body
      id-token: write                 # sign provenance
      attestations: write             # store provenance
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Build
        run: pip install --require-hashes -r .github/requirements/build.txt && python -m build --no-isolation
      # Official ClamAV image: the apt freshclam is blocked by the signature CDN on GitHub-hosted
      # runners ("Malformed CVD header"). The image ships signatures rebuilt daily; freshclam still
      # tries for newer ones first. clamscan exits 1 on a detection, which fails the job.
      - name: ClamAV scan (fails on detection)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/dist:/scan:ro" clamav/clamav:stable -c '
            freshclam --stdout --quiet || echo "::warning::freshclam failed, using the signatures shipped in the image"
            clamscan --version
            clamscan --recursive --infected /scan'
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # the Sigstore bundle as a release asset is what Scorecard's Signed-Releases check looks for
          cp "$BUNDLE" "vibesequence-$TAG.sigstore.json"
          gh release upload "$TAG" dist/* "vibesequence-$TAG.sigstore.json" --clobber --repo "$GITHUB_REPOSITORY"
      - uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            \.(whl|tar\.gz)$
          update_release_body: true
          request_rate: 4             # free API tier: 4 requests/minute
          # on a release event, `files` are regexes matched against the release asset names
